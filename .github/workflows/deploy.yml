name: Deploy With Docker to AWS Server
on:
  push:
    branches:
      - main #main commit and push = [main,master]
jobs:
  deploy:
    # Github Actions가 제공하는 Ubuntu 환경
    runs-on: ubuntu-latest
    # 실행순서 지정
    # name = stage = step
    steps:
     # 어떤 소스를 가지고올지 => src /build.gradle gradlew Dockerfile
     #코드 체크 (Repository)
     - name: Checkout:repository
       uses: actions/checkout@v4
     #JDK 설정 => Spring-Boot 프로젝트 build => jdk 설정
     - name: SetUp JDK 21
       uses: actions/setup-java@v4
       with:
         distribution: 'temurin'
         java-version: '21'
     # 환경 설정
     # DB관련 => .env
     - name: Set Environment
       run: |
         rm -f .env
         touch .env
         echo "COMMDB_URL=${{secrets.DB_URL}}" >> .env
         echo "DB_USERNAME=${{secrets.DB_USERNAME}}" >> .env
         echo "DB_USERPASSWORDE=${{secrets.DB_USERPASSWORD}}" >> .env
     # Gradlew 권한 부여 
     - name: Set gradlew permission
       run: |
         chmod +x ./gradlew
     # Gradle Build 
     - name: Build with Gradlew
       run: ./gradlew clean build -x test
     # Docker Hub 연결 - 로그인
     - name: Login to DockerHub
       run: |
         echo "${{secrets.DOCKER_PASSWORD}}" |\
         docker login \
         -u "${{secrets.DOCKER_NAME}}" \
         --password-stdin
     # Docker 이미지 생성
     - name: Build Docker Image
       run: |
         docker build \
         -t ${{secrets.DOCKER_NAME}}/last-app:latest
     # Docker Hub 업로드
     - name: Push Docker Image
       run: |
         docker push \
         ${{secrets.DOCKER_NAME}}/last-app:latest
     # AWS 연결 
     - name: Set SSH key Permission
       run: |
         mkdir -p ~/.ssh
         echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_ed25519
         chmod 600 ~/.ssh/id_ed25519
     # ADD SSH Key 
     - name: Add SSH Key 
       uses: webfactory/ssh-agent@v0.5.3
       with:
         ssh-private-key: ${{secrets.SERVER_SSH_KEY}}
     # Add Known_hosts
     - name: Add Known_hosts
       run: |
         ssh-keyscan -H ed25519 3.35.16.223 >> ~/.ssh/known_hosts
     # Docker Hub 이미지 Pull
     - name: Deploy to Server with rsync 
       run: |
         rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/libs/*.jar ubuntu@15.164.250.210:~/app
     # 9090 포트 Kill => container 삭제 
     - name: Run command 
       run: |
         ssh -i ~/.ssh/id_ed25519 ubuntu@15.164.250.210 << 'EOF'
           cd ~/app &&
           set -a &&
           source .env &&
           set +a &&
           nohup java -jar ~/app/BootLastProject-0.0.1-SNAPSHOT.jar > log.txt 2>&1 &
         EOF
     # 9090 포트 다시 구동 => docker run
